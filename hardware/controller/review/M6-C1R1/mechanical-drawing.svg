<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780"><style>text{font:14px sans-serif;fill:#17212b}.small{font-size:11px}</style><rect width="900" height="780" fill="white"/><text x="25" y="27">M6-C1 native mounting/interface drawing — dimensions mm — review only</text><g transform="translate(55,65) scale(5)"><rect x="0" y="0" width="100" height="100" fill="#e5f4e9" stroke="#17212b" stroke-width=".3"/><circle cx="19.0" cy="93.0" r=".7" fill="#15445c"/><text x="20.0" y="92.0" style="font-size:2.4px">J1 (19.00,93.00)</text><circle cx="3.6750000000000007" cy="20.0" r=".7" fill="#15445c"/><text x="4.675000000000001" y="19.0" style="font-size:2.4px">J2 (3.68,20.00)</text><circle cx="7.0" cy="56.0" r=".7" fill="#15445c"/><text x="8.0" y="55.0" style="font-size:2.4px">J4 (7.00,56.00)</text><circle cx="89.0" cy="56.0" r=".7" fill="#15445c"/><text x="90.0" y="55.0" style="font-size:2.4px">J5 (89.00,56.00)</text><circle cx="79.415" cy="8.5" r=".7" fill="#15445c"/><text x="80.415" y="7.5" style="font-size:2.4px">J7 (79.42,8.50)</text><circle cx="30.0" cy="15.0" r=".7" fill="#15445c"/><text x="31.0" y="14.0" style="font-size:2.4px">U10 (30.00,15.00)</text><circle cx="53.0" cy="26.0" r=".7" fill="#15445c"/><text x="54.0" y="25.0" style="font-size:2.4px">U20 (53.00,26.00)</text><circle cx="58.0" cy="90.0" r=".7" fill="#15445c"/><text x="59.0" y="89.0" style="font-size:2.4px">BT1 (58.00,90.00)</text><circle cx="5.0" cy="42.0" r="1.6" fill="white" stroke="black" stroke-width=".2"/><text x="6.0" y="41.0" style="font-size:2.4px">H1 (5.00,42.00)</text><circle cx="95.0" cy="5.0" r="1.6" fill="white" stroke="black" stroke-width=".2"/><text x="96.0" y="4.0" style="font-size:2.4px">H2 (95.00,5.00)</text><circle cx="95.0" cy="95.0" r="1.6" fill="white" stroke="black" stroke-width=".2"/><text x="96.0" y="94.0" style="font-size:2.4px">H3 (95.00,95.00)</text><circle cx="5.0" cy="95.0" r="1.6" fill="white" stroke="black" stroke-width=".2"/><text x="6.0" y="94.0" style="font-size:2.4px">H4 (5.00,95.00)</text><path d="M0,-4 H100 M-4,0 V100" stroke="black" stroke-width=".2"/><text x="43" y="-5" style="font-size:3px">100.00</text><text x="-12" y="50" style="font-size:3px" transform="rotate(-90,-12,50)">100.00</text></g><text x="590" y="88">Top-view connector numbering</text><text x="590" y="112" class="small">J4/J5: pad1 at upper-left, pad2 right;</text><text x="590" y="130" class="small">odd/even columns increase downward.</text><text x="590" y="155" class="small">Both RF boards have same local pin order.</text><text x="590" y="180" class="small">16P female: Würth61201623021</text><text x="590" y="198" class="small">20P female: Würth61202023021</text><text x="590" y="222" class="small">Continuity-test every conductor,1↔1.</text><text x="590" y="246" class="small">Stripe/key appearance alone is insufficient.</text><text x="590" y="280">J1 internal coded harness only</text><text x="590" y="304" class="small">1PACK_RAW /2GND /3ID resistor</text><text x="590" y="324" class="small">XHP-3 + SXH-001T-P0.6 contacts</text><text x="590" y="344" class="small">NOT a Li-ion balance connector.</text><text x="590" y="380">USB exits left edge.</text><text x="590" y="405" class="small">Keep top antenna area free of metal.</text><text x="40" y="610">Mechanical section (envelopes; not a common enclosure)</text><rect x="70" y="650" width="350" height="8" fill="#429a61"/><rect x="115" y="610" width="80" height="40" fill="#8999a3"/><text x="215" y="638">Controller top reserve15mm</text><path d="M80,658 V708 H410 V658" fill="none" stroke="black"/><text x="90" y="730">10mm controller standoffs; trim solder-side leads</text><rect x="550" y="650" width="290" height="8" fill="#429a61"/><rect x="620" y="658" width="150" height="105" fill="#a5afb6"/><text x="555" y="626">RF2M: retain25.2mm cooling below PCB</text><text x="555" y="778" class="small">Separate≥30mm supports; airflow/enclosure still unqualified.</text></svg>