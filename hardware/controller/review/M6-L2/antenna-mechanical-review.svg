tyle="font-size:2px">H3</text><circle cx="5.0" cy="95.0" r="1.6" fill="white" stroke="black" stroke-width=".2"/><text x="6.0" y="94.0" style="font-size:2px">H4</text><circle cx="20.0" cy="19.0" r=".5" fill="#183a50"/><text x="21.0" y="18.0" style="font-size:2px">JP1</text><circle cx="26.0" cy="23.0" r=".5" fill="#183a50"/><text x="27.0" y="22.0" style="font-size:2px">JP3</text><circle cx="17.0" cy="20.25" r=".5" fill="#183a50"/><text x="18.0" y="19.25" style="font-size:2px">TP81</text><circle cx="12.0" cy="39.0" r=".5" fill="#183a50"/><text x="13.0" y="38.0" style="font-size:2px">TP83</text><circle cx="36" cy="11.01" r="5" fill="#62b5ff" fill-opacity=".3" stroke="#2678ab" stroke-width=".3"/><path d="M36,11 V-6" stroke="#2678ab" stroke-width=".5"/><text x="37" y="3" style="font-size:2px">2.4GHz coax north</text></g><text x="610" y="90">Separate antenna ports</text><text x="610" y="115" class="small">U10:2.4GHz Wi-Fi/Bluetooth, MHF I/U.FL.</text><text x="610" y="138" class="small">J7:optional LoRa433/868MHz, U.FL.</text><text x="610" y="168" class="small">5mm radius mating/tool area above U10.</text><text x="610" y="190" class="small">8mm local overhead clearance.</text><text x="610" y="212" class="small">1.13mm coax: start with>=6mm bend radius.</text><text x="610" y="234" class="small">Enclosure strain relief, no connector cable load.</text><text x="610" y="275">Optional headers on underside</text><text x="610" y="300" class="small">J8 keyed PH2.0; G / DATA / VOLTAGE N/A.</text><text x="610" y="322" class="small">J9 2x5/2.54mm; square pad1 identifies cable.</text><text x="610" y="344" class="small">Allow>=10mm below controller for headers.</text><text x="610" y="380" class="small">USB-C, battery, IDC, RTC, UART and mounts</text><text x="610" y="402" class="small">retain their baseline positions.</text><text x="35" y="620">Preferred: independently supported side-by-side controller/RF boards, IDC cables.</text><text x="35" y="648">Optional stacking needs an independent carrier: no common bolt pattern is assumed.</text><text x="35" y="676">RF80 above controller:>=20mm. RF2M above:>=40mm including25.2mm cooling projection.</text><text x="35" y="704">Remove upper board to service coax. Real antenna, harness, enclosure, RF and thermal fit: NOT_RUN.</text></svg>
